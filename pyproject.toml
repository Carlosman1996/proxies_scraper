# pyproject.toml

[build-system]
requires      = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxies_scraper"
version = "0.1.0"
description = "A Python package for proxies scripting"
readme = "README.md"
authors = [
    { name="Carlosman1996", email="cmmolinas01@gmail.com" }
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["proxies", "scripting", "networking"]
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Homepage = "https://github.com/Carlosman1996/proxies_scraper"

[tool.setuptools.packages.find]
where = [""]
