[tox]
envlist =
    clean
    py3{12}
    style
    # typing
    format

[testenv]
deps =
    -r requirements.txt
    pytest
    pytest-cov
# Other pytest configuration is specified in project.toml file.
#   --cov-append helps to save coverage results between tox executions
commands = python -m pytest --cov-append

[testenv:style]
deps = ruff
commands = ruff check

[testenv:typing]
deps =
    mypy
    types-requests
    types-tabulate
    types-beautifulsoup4
commands = mypy .

[testenv:format]
deps =
    isort
    black
commands =
    isort . --check --diff
    black . --check --verbose --diff --color

[testenv:clean]
deps = coverage
skip_install = true
commands = coverage erase
